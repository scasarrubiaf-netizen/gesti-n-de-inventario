<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos | Inventarios</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            display: flex;
        }

        .sidebar {
            width: 220px;
            min-height: 100vh;
            background: #1e293b;
            color: white;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0; left: 0;
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-header h2 { font-size: 20px; color: #38bdf8; }

        .menu { padding: 16px 0; flex: 1; }

        .menu a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            color: #cbd5e1;
            text-decoration: none;
            font-size: 14px;
            transition: background 0.2s;
        }

        .menu a:hover, .menu a.active {
            background: rgba(255,255,255,0.08);
            color: white;
            border-left: 3px solid #cbd5e1;
        }

        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-footer button {
            width: 100%;
            padding: 10px;
            background: #475569;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .sidebar-footer button:hover { background: #334155; }

        .main-content {
            margin-left: 220px;
            padding: 24px;
            flex: 1;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .page-header h1 { font-size: 22px; color: #1e293b; }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-right input {
            padding: 9px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            width: 220px;
        }

        .header-right input:focus { border-color: #475569; }

        .btn-nuevo {
            padding: 9px 18px;
            background: #1e293b;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .btn-nuevo:hover { background: #334155; }

        #fechaHora { font-size: 13px; color: #64748b; }

        .tabla-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        thead th {
            background: #f8fafc;
            padding: 12px 16px;
            text-align: left;
            color: #64748b;
            font-weight: 600;
            border-bottom: 1px solid #e2e8f0;
        }

        tbody td {
            padding: 12px 16px;
            border-bottom: 1px solid #f1f5f9;
            color: #334155;
        }

        tbody tr:hover { background: #f8fafc; }
        tbody tr:last-child td { border-bottom: none; }

        .stock-bajo td { background: #f8fafc !important; color: #475569; }
        .stock-bajo:hover td { background: #f1f5f9 !important; }

        .badge-stock {
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-ok { background: #f1f5f9; color: #475569; }
        .badge-bajo { background: #e2e8f0; color: #334155; }

        .btn-editar, .btn-eliminar {
            padding: 6px 12px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            margin-right: 4px;
            background: #f1f5f9;
            color: #334155;
        }

        .btn-editar:hover, .btn-eliminar:hover { background: #e2e8f0; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.activo { display: flex; }

        .modal-contenido {
            background: white;
            border-radius: 12px;
            padding: 30px;
            width: 460px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }

        .modal-contenido h3 {
            font-size: 18px;
            color: #1e293b;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e2e8f0;
        }

        .form-grupo { margin-bottom: 14px; }

        .form-grupo label {
            display: block;
            font-size: 13px;
            color: #475569;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .form-grupo input,
        .form-grupo select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .form-grupo input:focus,
        .form-grupo select:focus { border-color: #475569; }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .acciones-modal {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-guardar {
            flex: 1;
            padding: 11px;
            background: #1e293b;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .btn-guardar:hover { background: #334155; }

        .btn-cancelar {
            flex: 1;
            padding: 11px;
            background: #f1f5f9;
            color: #475569;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>

<body>

<aside class="sidebar">
    <div class="sidebar-header">
        <h2>📦 Inventarios</h2>
    </div>
    <nav class="menu">
        <a href="dashboard.html">📊 Dashboard</a>
        <a href="productos.html" class="active">📦 Productos</a>
        <a href="movimientos.html">🔄 Movimientos</a>
        <a href="categorias.html">🗂 Categorías</a>
        <a href="estadisticas.html">📈 Estadísticas</a>
        <a href="productos-mas-vendidos.html">🏆 Más vendidos</a>
        <a href="reporte-stock.html">📉 Reporte stock</a>
        <a href="valor-inventario.html">💰 Valor inventario</a>
    </nav>
    <div class="sidebar-footer">
        <button onclick="logout()">🚪 Cerrar sesión</button>
    </div>
</aside>

<main class="main-content">

    <div class="page-header">
        <h1>📦 Gestión de Productos</h1>
        <div class="header-right">
            <input type="text" id="buscador" placeholder="🔍 Buscar producto...">
            <button class="btn-nuevo" onclick="abrirModal()">+ Nuevo producto</button>
            <span id="fechaHora"></span>
        </div>
    </div>

    <div class="tabla-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Código barras</th>
                    <th>Nombre</th>
                    <th>Categoría</th>
                    <th>Cantidad</th>
                    <th>Stock mínimo</th>
                    <th>Precio</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaProductos"></tbody>
        </table>
    </div>

</main>

<div id="modalProducto" class="modal">
    <div class="modal-contenido">
        <h3 id="tituloModal">Nuevo producto</h3>
        <form id="formProducto" onsubmit="event.preventDefault(); guardarProducto();">
            <div class="form-grid">
                <div class="form-grupo">
                    <label>Código de barras</label>
                    <input type="text" id="codigoBarras" required>
                </div>
                <div class="form-grupo">
                    <label>Categoría</label>
                    <select id="categoria"></select>
                </div>
            </div>
            <div class="form-grupo">
                <label>Nombre del producto</label>
                <input type="text" id="nombre" required>
            </div>
            <div class="form-grid">
                <div class="form-grupo">
                    <label>Cantidad</label>
                    <input type="number" id="cantidad" required min="0">
                </div>
                <div class="form-grupo">
                    <label>Stock mínimo</label>
                    <input type="number" id="stockMinimo" required min="0">
                </div>
            </div>
            <div class="form-grupo">
                <label>Precio</label>
                <input type="number" id="precio" step="0.01" required min="0">
            </div>
            <div class="acciones-modal">
                <button type="submit" class="btn-guardar">💾 Guardar</button>
                <button type="button" class="btn-cancelar" onclick="cerrarModal()">Cancelar</button>
            </div>
        </form>
    </div>
</div>

<script src="../js/productos.js"></script>
<script>
    const rol = localStorage.getItem("rol");
    const usuario = localStorage.getItem("usuario");
    if (!rol || !usuario || rol !== "ADMIN") {
        window.location.href = "../login.html";
    }
    function logout() {
        localStorage.removeItem("usuario");
        localStorage.removeItem("rol");
        window.location.href = "../login.html";
    }
</script>
</body>
</html>
